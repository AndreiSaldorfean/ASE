<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="auth-container">
    <h1>Register</h1>
    <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" class="form">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Username
            <input type="text" th:field="*{username}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        <label>Email
            <input type="email" th:field="*{email}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <label>Password
            <input type="password" th:field="*{password}">
        </label>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div class="error" th:if="${#fields.hasGlobalErrors()}" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        <button type="submit">Create account</button>
    </form>
    <p>Have an account? <a th:href="@{/auth/login}">Login</a></p>
</div>
</body>
</html>
